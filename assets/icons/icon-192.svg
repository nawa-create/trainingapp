<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="backlight" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#90AFC5" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#336B87" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e2627" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90AFC5" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#90AFC5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#90AFC5" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="topLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#90AFC5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#90AFC5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" fill="#0d1314"/>

  <!-- Back light glow -->
  <ellipse cx="96" cy="45" rx="85" ry="55" fill="url(#backlight)"/>

  <!-- Muscular silhouette -->
  <path d="
    M96 28
    C82 28 72 38 72 50
    C72 62 82 72 96 72
    C110 72 120 62 120 50
    C120 38 110 28 96 28
    Z
  " fill="#151c1d"/>

  <!-- Neck -->
  <path d="M88 68 L88 78 L104 78 L104 68" fill="#151c1d"/>

  <!-- Traps and shoulders -->
  <path d="
    M88 75
    L65 82
    C50 86 35 98 25 118
    L18 145
    L32 155
    L45 125
    L52 145
    L48 192
    L75 192
    L82 150
    L96 140
    L110 150
    L117 192
    L144 192
    L140 145
    L147 125
    L160 155
    L174 145
    L167 118
    C157 98 142 86 127 82
    L104 75
    L96 78
    L88 75
    Z
  " fill="#151c1d"/>

  <!-- Edge lighting - left shoulder -->
  <path d="
    M65 82
    C50 86 35 98 25 118
    L18 145
  " stroke="url(#bodyEdge)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Edge lighting - right shoulder -->
  <path d="
    M127 82
    C142 86 157 98 167 118
    L174 145
  " stroke="url(#bodyEdge)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Top head rim light -->
  <path d="
    M75 42
    C80 32 88 28 96 28
    C104 28 112 32 117 42
  " stroke="#90AFC5" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Shoulder/deltoid highlights -->
  <ellipse cx="50" cy="100" rx="10" ry="5" fill="#90AFC5" opacity="0.08"/>
  <ellipse cx="142" cy="100" rx="10" ry="5" fill="#90AFC5" opacity="0.08"/>

  <!-- Trap highlight -->
  <ellipse cx="96" cy="85" rx="15" ry="6" fill="#90AFC5" opacity="0.06"/>

  <!-- Chest center subtle highlight -->
  <ellipse cx="96" cy="110" rx="18" ry="10" fill="#336B87" opacity="0.1"/>
</svg>