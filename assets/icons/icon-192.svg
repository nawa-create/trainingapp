<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2410c"/>
      <stop offset="30%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#fdba74"/>
      <stop offset="70%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#c2410c"/>
    </linearGradient>
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#9a3412"/>
    </linearGradient>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="#0a0a0f"/>

  <!-- Glow effects -->
  <ellipse cx="96" cy="96" rx="70" ry="70" fill="url(#glow2)"/>
  <ellipse cx="96" cy="96" rx="50" ry="50" fill="url(#glow1)"/>

  <!-- Dumbbell - rotated 45 degrees -->
  <g transform="translate(96, 96) rotate(-45) translate(-96, -96)" filter="url(#glowFilter)">
    <!-- Bar -->
    <rect x="56" y="92" width="80" height="8" rx="4" fill="url(#metalGradient)"/>

    <!-- Left plates -->
    <rect x="36" y="76" width="12" height="40" rx="3" fill="url(#plateGradient)"/>
    <rect x="48" y="80" width="10" height="32" rx="2" fill="url(#plateGradient)"/>

    <!-- Right plates -->
    <rect x="144" y="76" width="12" height="40" rx="3" fill="url(#plateGradient)"/>
    <rect x="134" y="80" width="10" height="32" rx="2" fill="url(#plateGradient)"/>

    <!-- Collars -->
    <rect x="52" y="88" width="6" height="16" rx="1" fill="#fdba74"/>
    <rect x="134" y="88" width="6" height="16" rx="1" fill="#fdba74"/>
  </g>

  <!-- Light streaks -->
  <g opacity="0.4">
    <ellipse cx="60" cy="60" rx="30" ry="2" transform="rotate(-45 60 60)" fill="url(#metalGradient)"/>
    <ellipse cx="132" cy="132" rx="30" ry="2" transform="rotate(-45 132 132)" fill="url(#metalGradient)"/>
  </g>
</svg>
